name: mCore - Build and Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mcore-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build mCore.jar
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Run offline data importer tests
        run: python3 -m unittest discover -s tests -v

      - name: Build and package shaded plugin
        run: ./gradlew --no-daemon clean build

      - name: Verify generated JAR
        shell: bash
        run: |
          test -s build/libs/mCore.jar
          ls -lh build/libs/mCore.jar

      - name: Upload mCore artifact
        uses: actions/upload-artifact@v4
        with:
          name: mCore-1.21.1-jar
          path: build/libs/mCore.jar
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Checkout tagged source
        uses: actions/checkout@v4

      - name: Verify tag matches project version
        shell: bash
        run: |
          VERSION="$(sed -n 's/^version = "\(.*\)"/\1/p' build.gradle.kts | head -n 1)"
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          if [ -z "$VERSION" ]; then
            echo "::error::Could not read project version from build.gradle.kts"
            exit 1
          fi
          if [ "$VERSION" != "$TAG_VERSION" ]; then
            echo "::error::Tag version '$TAG_VERSION' does not match build.gradle.kts version '$VERSION'"
            exit 1
          fi

      - name: Download built JAR
        uses: actions/download-artifact@v4
        with:
          name: mCore-1.21.1-jar
          path: dist

      - name: Generate SHA-256 checksum
        run: sha256sum dist/mCore.jar > dist/mCore.jar.sha256

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            dist/mCore.jar \
            dist/mCore.jar.sha256 \
            --title "mCore ${GITHUB_REF_NAME}" \
            --generate-notes
