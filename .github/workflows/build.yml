name: mCore - JDK 21 / Spigot 1.21.1 validation

concurrency:
  group: mcore-spigot-1211-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches:
      - main
      - "refactor/**"
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Validate offline data importer
        run: python3 -m unittest discover -s tests -v

      - name: Compile and package with Gradle Wrapper
        run: ./gradlew --no-daemon clean build

      - name: Verify generated JAR
        run: test -s build/libs/mCore.jar

      - name: Upload mCore plugin JAR
        uses: actions/upload-artifact@v4
        with:
          name: mCore-1.21.1-jar
          path: build/libs/mCore.jar
          if-no-files-found: error
          retention-days: 7
