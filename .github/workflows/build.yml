name: Legacy build validation

concurrency:
  group: legacy-build-validation-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches:
      - main
      - "refactor/**"
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "8"
          cache: gradle

      - name: Build Spigot 1.8.8 API/NMS artifacts
        uses: SpraxDev/Action-SpigotMC@v5
        with:
          versions: "1.8.8"
          generateSrc: false
          generateDoc: false

      - name: Validate MongoDB export importer
        run: python3 -m unittest discover -s tests -v

      - name: Compile and package with Gradle Wrapper
        run: ./gradlew --no-daemon clean build

      - name: Upload mCore plugin JAR
        uses: actions/upload-artifact@v4
        with:
          name: mCore-jar
          path: build/libs/mCore.jar
          if-no-files-found: error
          retention-days: 7
