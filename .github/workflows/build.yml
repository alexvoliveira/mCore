name: mCore build validation (JDK 21 / Spigot 1.21.1)

concurrency:
  group: mcore-build-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches:
      - main
      - "refactor/**"
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Validate offline migration tests
        run: python -m unittest discover -s tests -v

      - name: Compile and package
        run: ./gradlew --no-daemon clean build
